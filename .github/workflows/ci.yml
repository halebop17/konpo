name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # The unit tests are app-hosted (they use @testable import against the
      # app target), so this both builds Konpo.app and runs KonpoTests.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Konpo \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -scheme Konpo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  release-build:
    name: Release build
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # The app builds warning-free today; -warnings-as-errors keeps it that way.
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Konpo \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
